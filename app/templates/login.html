{% extends "base.html" %}
{% block title %} · Sign in{% endblock %}
{% block body_class %}auth{% endblock %}
{% block content %}
<main class="auth-shell">
  <div class="auth-card">
    <a class="brand" href="/">InboxMate</a>
    <h1>Sign in</h1>
    <p class="muted">Welcome back. Your inbox, without the noise.</p>
    {% if error %}<p class="flash error">{{ error }}</p>{% endif %}
    <form method="post" action="/login">
      <input type="hidden" name="next" value="{{ next or '' }}">
      <label>Email
        <input type="email" name="email" required autocomplete="email" placeholder="you@example.com" value="">
      </label>
      <label>Password
        <input type="password" name="password" required autocomplete="current-password" placeholder="••••••••">
      </label>
      <button class="btn btn-primary btn-block" type="submit">Sign in</button>
    </form>
    <p class="switch">New here? <a href="/register">Create an account</a></p>
  </div>
</main>
{% endblock %}
